version: 2
updates:
  # Actions are pinned by commit SHA; this keeps the pins (and their
  # version comments) up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
