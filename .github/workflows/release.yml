name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  # Runs dev dependencies (install scripts, test suite, build) with a
  # read-only token, so a compromised dev dependency cannot publish or push.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Gets the write and OIDC permissions, and runs no dev dependency code
  # except @changesets/cli: install scripts and the prepack build are
  # skipped, and the dist/ tested above is published.
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # version commits and tags
      pull-requests: write # the "Version Packages" PR
      id-token: write # npm provenance and trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@11.21.3 --ignore-scripts
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: test -f dist/index.js && test -f dist/index.cjs

      # With pending changesets: opens/updates the "Version Packages" PR.
      # When that PR is merged (no changesets left): publishes to npm.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npx changeset version
          publish-script: npm run release
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
        env:
          # Skips prepack: dist/ is the artifact built and tested above.
          npm_config_ignore_scripts: 'true'
          # Leave the NPM_TOKEN secret unset once trusted publishing is
          # configured on npmjs.com; it is only needed for the first release.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
